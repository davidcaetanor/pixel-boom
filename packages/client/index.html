<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14121c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icone-192.png" />
    <title>PixelBoom</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14121c;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      .is-touch body {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      .is-touch .lobby button,
      .is-touch .lobby input {
        touch-action: manipulation;
      }
      #game {
        display: grid;
        place-items: center;
        height: 100%;
        height: 100dvh;
      }
      canvas {
        image-rendering: pixelated;
      }
      .lobby {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* Courier New tem avanco de 0,6 em: a 10 px cada caractere mede 6 px inteiros. */
        font-family: "Courier New", monospace;
        color: #f4ecd8;
        /* Arena montada com os tiles do jogo, na mesma escala do canvas. */
        background:
          linear-gradient(rgba(20, 18, 28, 0.55), rgba(20, 18, 28, 0.55)),
          url(/ui-fundo.png) 0 0 / calc(960px * var(--ui-zoom, 2)) auto;
        image-rendering: pixelated;
      }
      /*
       * Dentro do painel as medidas sao em pixels de arte; o zoom inteiro em
       * pixels fisicos (--ui-zoom, de pixel-scale.ts) amplia tudo junto,
       * igual ao canvas. Bordas de 9-slice usam o tamanho nativo de cada peca.
       */
      .ui-panel {
        zoom: var(--ui-zoom, 2);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 0 4px;
        border: 28px solid transparent;
        border-image: url(/ui-painel.png) 28 fill / 28px round;
        font-size: 10px;
        /* Altura de linha inteira: "normal" e fracionaria e desalinha a grade. */
        line-height: 12px;
      }
      .lobby h1 {
        margin: 0;
        line-height: 0;
      }
      .ui-logo {
        display: block;
      }
      .lobby form {
        display: flex;
        gap: 4px;
      }
      .lobby input,
      .lobby button {
        font: inherit;
        line-height: 12px;
        padding: 0 2px;
      }
      .lobby input {
        width: 7ch;
        color: #f4ecd8;
        background: none;
        border: 10px solid transparent;
        border-image: url(/ui-slot.png) 10 fill / 10px stretch;
        text-transform: uppercase;
        outline: none;
      }
      .lobby input:disabled {
        opacity: 0.5;
      }
      .lobby button {
        color: #14121c;
        font-weight: bold;
        background: none;
        border: solid transparent;
        border-width: 10px 12px;
        border-image: url(/ui-botao.png) 10 12 fill / 10px 12px stretch;
        cursor: pointer;
      }
      @media (hover: hover) {
        .lobby button:hover:not(:disabled) {
          border-image-source: url(/ui-botao-hover.png);
        }
      }
      .lobby button:active:not(:disabled) {
        border-image-source: url(/ui-botao-pressionado.png);
      }
      .lobby button:disabled {
        border-image-source: url(/ui-botao-desabilitado.png);
        color: #5a5866;
        cursor: default;
      }
      .lobby .room-main {
        box-sizing: border-box;
        width: 128px;
        padding: 0;
      }
      .lobby .room-main.is-danger {
        color: #7a1c18;
      }
      .room .ui-panel {
        position: relative;
      }
      .room h1 {
        line-height: normal;
      }
      /* Centrada na linha do titulo: alinhada pelo topo, encostaria nos cartoes da sala contra bot. */
      .lobby button.room-gear {
        box-sizing: content-box;
        position: absolute;
        top: -3px;
        right: 0;
        width: 28px;
        height: 28px;
        padding: 0;
        border: none;
        border-image: none;
        background: url(/ui-engrenagem.png) no-repeat;
      }
      .lobby button.room-gear:hover:not(:disabled),
      .lobby button.room-gear:focus-visible:not(:disabled) {
        border-image: none;
        background-image: url(/ui-engrenagem-foco.png);
      }
      .lobby.room-settings h2,
      .lobby.pause h2 {
        font-size: 20px;
        line-height: normal;
      }
      .lobby.room-settings .ui-panel,
      .lobby.pause .ui-panel {
        gap: 12px;
      }
      .room-summary,
      .pause-summary {
        margin: 0;
        color: #c4c4cc;
        text-align: center;
      }
      .lobby.room-settings,
      .lobby.pause {
        background: rgba(20, 18, 28, 0.6);
      }
      .lobby.room-settings[hidden],
      .lobby.pause[hidden] {
        display: none;
      }
      .config {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .config-row {
        display: grid;
        grid-template-columns: 6ch auto;
        gap: 8px;
        align-items: center;
      }
      .config-label {
        text-align: right;
      }
      .config-step {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .config-value {
        width: 13ch;
        text-align: center;
      }
      /* Largura fixa: trocar de tela no menu nao redimensiona o painel. */
      .lobby.pause .ui-panel,
      .lobby.room-settings .ui-panel {
        width: 220px;
      }
      .pause-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .pause-screen[hidden] {
        display: none;
      }
      .pause-warning {
        margin: 0;
        color: #ff9228;
      }
      .roster {
        display: grid;
        grid-template-columns: repeat(4, auto);
        gap: 4px;
      }
      .lobby .roster-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0;
        font-weight: normal;
        color: #f4ecd8;
        /* 10 + 48 do personagem + 12 do rotulo + 10 = 80, na grade de 8 px. */
        border-width: 10px;
        border-image: url(/ui-slot.png) 10 fill / 10px stretch;
        outline-offset: 0;
      }
      .lobby .roster-card:active:not(:disabled) {
        border-image-source: url(/ui-slot-hover.png);
      }
      @media (hover: hover) {
        .lobby .roster-card:hover:not(:disabled) {
          border-image-source: url(/ui-slot-hover.png);
        }
      }
      .lobby .roster-card.is-mine,
      .lobby .roster-card.is-mine:hover {
        border-image-source: url(/ui-slot-selecionado.png);
      }
      .lobby .roster-card:disabled {
        border-image-source: url(/ui-slot-ocupado.png);
        color: #f4ecd8;
      }
      .lobby .roster-card:disabled .roster-preview {
        opacity: 0.45;
      }
      .roster-preview {
        display: block;
        background-repeat: no-repeat;
        background-position: 0 0;
      }
      .roster-host {
        position: absolute;
        top: -12px;
        right: -12px;
      }
      .room-status {
        margin: 0;
      }
      .roster-cell {
        position: relative;
        display: flex;
      }
      /* 14x14 com o canto no vertice do cartao, como a coroa. */
      .lobby .roster-kick {
        position: absolute;
        top: -5px;
        right: -5px;
        width: 14px;
        height: 14px;
        padding: 0;
        border: none;
        border-image: none;
        background: url(/ui-remover.png) no-repeat;
      }
      .lobby .roster-kick:hover,
      .lobby .roster-kick:focus-visible {
        border-image: none;
        background-image: url(/ui-remover-hover.png);
      }
      .room .ui-panel {
        gap: 12px;
      }
      /* Recuado para dentro do cartao: na grade, o X do vizinho avanca 5 px sobre ele. */
      .lobby .roster-bot {
        position: absolute;
        top: -5px;
        left: 6px;
        width: 24px;
        height: 12px;
        padding: 0;
        border: none;
        border-image: none;
        background: url(/ui-bot-normal.png) no-repeat;
      }
      .lobby .roster-bot.is-hard {
        background-image: url(/ui-bot-dificil.png);
      }
      .lobby .roster-bot:hover:not(:disabled),
      .lobby .roster-bot:focus-visible {
        border-image: none;
        background-image: url(/ui-bot-normal-foco.png);
      }
      .lobby .roster-bot.is-hard:hover:not(:disabled),
      .lobby .roster-bot.is-hard:focus-visible {
        background-image: url(/ui-bot-dificil-foco.png);
      }
      .lobby .roster-bot:disabled {
        border-image: none;
        cursor: default;
      }
      .lobby .roster-card.is-taken,
      .lobby .roster-card.is-taken:hover {
        border-image-source: url(/ui-slot-ocupado.png);
      }
      .lobby .roster-card.is-editing,
      .lobby .roster-card.is-editing:hover {
        border-image-source: url(/ui-slot-selecionado.png);
      }
      .lobby .roster-card.is-target {
        border-image-source: url(/ui-slot-hover.png);
      }
      .lobby .roster-card.is-taken:not(.is-editing) .roster-preview {
        opacity: 0.45;
      }
      .lobby-error {
        min-height: 10px;
        margin: 0;
        color: #ff5a4a;
      }
      .lobby button:not(.roster-card):focus-visible:not(:disabled) {
        outline: none;
        border-image-source: url(/ui-botao-foco.png);
      }
      .lobby .roster-card:focus-visible:not(:disabled) {
        border-image-source: url(/ui-slot-hover.png);
      }
      .lobby input:focus-visible {
        border-image-source: url(/ui-slot-selecionado.png);
      }
      .lobby-tela {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .lobby-tela[hidden] {
        display: none;
      }
      .lobby-tela > button {
        min-width: 128px;
      }
      .lobby-campo {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .lobby .lobby-apelido {
        width: 13ch;
      }
      .lobby h2 {
        margin: 0;
        font-size: inherit;
      }
      .lobby p {
        margin: 0;
      }
      .lobby-tela p {
        max-width: 192px;
        text-align: center;
      }
      .lobby-error.is-info {
        color: #f4ecd8;
      }
      .lobby-hint {
        color: #9a94a8;
      }
      .lobby-ajuda {
        display: grid;
        grid-template-columns: auto auto;
        align-items: center;
        gap: 4px 8px;
        margin: 0;
      }
      .lobby-ajuda dt {
        justify-self: end;
      }
      .lobby-ajuda dd {
        margin: 0;
      }
      .lobby-ajuda img {
        display: block;
        width: 16px;
        height: 16px;
      }
      /*
       * Controles de toque. As pecas ficam em escala inteira (--touch-zoom) e,
       * quando sobra espaco ao lado da arena, centradas nessa faixa.
       */
      .touch {
        position: fixed;
        inset: 0;
        pointer-events: none;
        --pad-l: calc(98px * var(--touch-zoom, 1));
        --pad-a: calc(103px * var(--touch-zoom, 1));
        --bomba: calc(74px * var(--touch-zoom, 1));
        --pausa: calc(25px * var(--touch-zoom, 1));
        --base: max(calc(env(safe-area-inset-bottom) + 12px), 9vh);
      }
      .touch[hidden] {
        display: none;
      }
      .touch-zona {
        position: absolute;
        top: 24%;
        bottom: 0;
        width: 44%;
        pointer-events: auto;
        touch-action: none;
      }
      .touch-zona.is-andar {
        left: 0;
      }
      .touch-zona.is-bomba {
        right: 0;
      }
      .touch-pad,
      .touch-bomba,
      .touch-pausa,
      .touch-seta {
        background-size: 100% 100%;
        image-rendering: pixelated;
      }
      /*
       * Direcional e bomba ficam sobre a arena: translucidos sempre, inclusive
       * apertados, para nao esconder quem esta embaixo. O contorno escuro
       * segura a forma sobre o verde.
       */
      .touch-pad,
      .touch-bomba {
        opacity: 0.35;
        filter: drop-shadow(1px 0 0 #14121c) drop-shadow(-1px 0 0 #14121c) drop-shadow(0 1px 0 #14121c)
          drop-shadow(0 -1px 0 #14121c);
      }
      .touch-pad {
        position: absolute;
        left: max(calc(env(safe-area-inset-left) + 12px), calc((var(--arena-margem, 0px) - var(--pad-l)) / 2));
        bottom: var(--base);
        width: var(--pad-l);
        height: var(--pad-a);
        background-image: url(/ui-toque-direcional.png);
      }
      .touch-seta {
        position: absolute;
        inset: 0;
        display: none;
      }
      .touch-seta.is-up {
        background-image: url(/ui-toque-seta-cima.png);
      }
      .touch-seta.is-right {
        background-image: url(/ui-toque-seta-direita.png);
      }
      .touch-seta.is-down {
        background-image: url(/ui-toque-seta-baixo.png);
      }
      .touch-seta.is-left {
        background-image: url(/ui-toque-seta-esquerda.png);
      }
      .touch-pad[data-y="-1"] .is-up,
      .touch-pad[data-x="1"] .is-right,
      .touch-pad[data-y="1"] .is-down,
      .touch-pad[data-x="-1"] .is-left {
        display: block;
      }
      .touch-bomba {
        position: absolute;
        right: max(calc(env(safe-area-inset-right) + 12px), calc((var(--arena-margem, 0px) - var(--bomba)) / 2));
        bottom: calc(var(--base) + (var(--pad-a) - var(--bomba)) / 2);
        width: var(--bomba);
        height: var(--bomba);
        background-image: url(/ui-toque-bomba.png);
      }
      .touch-bomba.is-ativo {
        background-image: url(/ui-toque-bomba-pressionada.png);
      }
      .touch-pausa {
        position: absolute;
        top: max(calc(env(safe-area-inset-top) + 8px), 8px);
        right: max(calc(env(safe-area-inset-right) + 8px), calc((var(--arena-margem, 0px) - var(--pausa)) / 2));
        width: var(--pausa);
        height: var(--pausa);
        padding: 0;
        border: none;
        background-color: transparent;
        background-image: url(/ui-toque-pausa.png);
        pointer-events: auto;
        touch-action: manipulation;
      }
      .touch-pausa::after {
        content: "";
        position: absolute;
        inset: -10px;
      }
      .touch-pausa:active {
        filter: brightness(0.8);
      }
      /* Alvo de toque maior que o desenho, sem mudar o visual dos paineis. */
      .is-touch .lobby button:not(.room-gear, .roster-kick, .roster-bot) {
        position: relative;
      }
      .is-touch .lobby button::after {
        content: "";
        position: absolute;
        inset: -14px -16px;
      }
      .is-touch .lobby .roster-card::after {
        inset: -12px;
      }
      .is-touch .lobby .room-gear::after {
        inset: -8px;
      }
      .is-touch .lobby .roster-kick::after,
      .is-touch .lobby .roster-bot::after {
        inset: -6px;
      }
      .girar {
        display: none;
      }
      @media (orientation: portrait) {
        .is-touch .girar {
          position: fixed;
          inset: 0;
          z-index: 10;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #14121c;
          font-family: "Courier New", monospace;
          color: #f4ecd8;
        }
      }
      .girar .ui-panel {
        padding: 8px 12px;
      }
      .girar-aparelho {
        width: 20px;
        height: 32px;
        box-sizing: border-box;
        border: 6px solid transparent;
        border-image: url(/ui-slot.png) 10 fill / 6px stretch;
        animation: girar 2s steps(1) infinite;
      }
      @keyframes girar {
        50% {
          transform: rotate(-90deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .girar-aparelho {
          animation: none;
          transform: rotate(-90deg);
        }
      }
      /*
       * Sala em tela baixa: os cards a esquerda, titulo e acoes a direita.
       * pixel-scale.ts liga .ui-deitada quando esse formato ganha zoom.
       */
      .ui-deitada .room:not(.room-settings) .ui-panel {
        display: grid;
        grid-template-columns: auto 160px;
        grid-auto-rows: auto;
        column-gap: 16px;
        row-gap: 8px;
        align-items: center;
        justify-items: center;
      }
      .ui-deitada .room:not(.room-settings) .ui-panel > * {
        grid-column: 2;
      }
      .ui-deitada .room:not(.room-settings) .ui-panel > .roster {
        grid-column: 1;
        grid-row: 1 / span 7;
      }
      .ui-deitada .room:not(.room-settings) .room-summary,
      .ui-deitada .room:not(.room-settings) .room-status {
        max-width: 160px;
        text-align: center;
      }
      .ui-deitada .room:not(.room-settings) h1 {
        justify-self: start;
        font-size: 16px;
      }
      .ui-deitada .room:not(.room-settings) .room-gear {
        top: -3px;
        right: 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div class="girar" role="alert">
      <div class="ui-panel">
        <div class="girar-aparelho"></div>
        <p>Gire o celular</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
